<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب کاربری | SmartClass Pro</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#eaf9f7,#eff5ff);min-height:100vh;color:#173c40;font:15px Tahoma,Arial,sans-serif}main{max-width:490px;margin:35px auto;padding:26px;border:1px solid #d8e8eb;border-radius:22px;background:white;box-shadow:0 12px 38px #24747b14}h1{font-size:25px}p{line-height:2}.muted{color:#60777c}label{display:block;font-weight:bold;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #bfd4d4;border-radius:10px;font:15px Tahoma}button{cursor:pointer;background:#176d7b;color:white;border:0;border-radius:11px;padding:12px 18px;font:14px Tahoma;margin:4px}.tabs{display:flex;flex-wrap:wrap}.tabs button{background:#e6f1f0;color:#20525a}.tabs .active{background:#176d7b;color:white}.hidden{display:none}#message{white-space:pre-wrap;border-radius:10px;background:#f3f8f9;padding:12px}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.links a{color:#145f78;text-decoration:none;background:#e9f5f4;padding:10px;border-radius:10px}code{direction:ltr;display:block;overflow-wrap:anywhere;padding:12px;background:#f1f5f4;border-radius:8px}</style></head><body><main><h1>حساب کاربری SmartClass</h1><p class="muted">برای حفظ حریم خصوصی، نام کاربری مستعار انتخاب کن. نام خانوادگی، ایمیل و شماره تلفن لازم نیست.</p><div id="profile" class="hidden"><h2 id="greeting"></h2><p id="role"></p><button id="logout">خروج از حساب</button></div><div id="guest"><div class="tabs"><button data-mode="login" class="active">ورود</button><button data-mode="register">ساخت حساب</button><button data-mode="recover">بازیابی رمز</button></div><form id="accountForm"><div id="newName" class="hidden"><label>نام نمایشی</label><input name="name" maxlength="30" placeholder="مثلاً کاوشگر"></div><label>نام کاربری انگلیسی</label><input name="username" pattern="[-a-zA-Z0-9_]{3,30}" required minlength="3" maxlength="30" autocomplete="username"><div id="recoverCode" class="hidden"><label>کد بازیابی</label><input name="recoveryCode"></div><label id="passwordLabel">رمز عبور (حداقل ۱۰ نویسه)</label><input name="password" type="password" required minlength="10" autocomplete="current-password"><button type="submit">ادامه</button></form></div><p id="message" role="status"></p><div id="recovery" class="hidden"><p>کد بازیابی را در محل امن نزد خودت یا والدینت نگه دار؛ دوباره نمایش داده نمی‌شود.</p><code id="generatedCode"></code></div><div class="links"><a href="/">صفحه اصلی</a><a href="/admin-users/">مدیریت کاربران</a><a href="/teacher-exams/">آزمون‌ساز معلم</a></div></main><script>
let mode='login';const $=id=>document.getElementById(id),message=$('message');const show=(id,v)=>$(id).classList.toggle('hidden',!v);
async function request(path,data){const res=await fetch('/api/account/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});let json=await res.json();if(!res.ok)throw Error(json.error||'درخواست ناموفق بود.');return json}
function view(u){show('profile',!!u);show('guest',!u);if(u){$('greeting').textContent='سلام '+u.name;$('role').textContent='نقش: '+({admin:'مدیر',teacher:'آموزگار',student:'دانش‌آموز'}[u.role]||'کاربر')}}
async function load(){try{view((await request('me')).user);message.textContent=''}catch(e){view(null);message.textContent=e.message}}load();
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));show('newName',mode==='register');show('recoverCode',mode==='recover');$('passwordLabel').textContent=mode==='recover'?'رمز جدید (حداقل ۱۰ نویسه)':'رمز عبور (حداقل ۱۰ نویسه)';$('accountForm').elements.namedItem('password').autocomplete=mode==='login'?'current-password':'new-password';message.textContent=''});
$('accountForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),data={username:f.get('username'),password:f.get('password'),name:f.get('name'),recoveryCode:f.get('recoveryCode')};message.textContent='در حال بررسی…';try{let r=await request(mode,data);view(r.user);message.textContent='عملیات موفق بود.';if(r.recoveryCode){show('recovery',true);$('generatedCode').textContent=r.recoveryCode}else show('recovery',false)}catch(e){message.textContent=e.message}};
$('logout').onclick=async()=>{try{await request('logout',{});view(null);show('recovery',false);message.textContent='از حساب خارج شدی.'}catch(e){message.textContent=e.message}};
</script></body></html>
