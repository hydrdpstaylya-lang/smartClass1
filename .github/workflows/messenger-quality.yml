name: Messenger quality checks

on:
  push:
    branches:
      - feature/messenger
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: messenger-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test messenger and build SmartClass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Build production site
        run: npm run build
